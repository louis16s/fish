<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/ui/favicon.svg?v=ui-2026.02.28-02" type="image/svg+xml">
  <title>管理 | 水闸控制面板</title>
  <style>
    :root{
      --bg0:#060812;
      --bg1:#0b1730;
      --text:rgba(231,238,252,.96);
      --muted:rgba(165,180,207,.78);
      --muted2:rgba(124,141,180,.68);
      --stroke:rgba(255,255,255,.08);
      --stroke2:rgba(255,255,255,.12);
      --surface:rgba(255,255,255,.06);
      --surface2:rgba(2,6,23,.32);
      --shadow1:0 16px 50px rgba(0,0,0,.46);
      --radius-panel:20px;
      --radius-card:16px;
      --radius-btn:14px;
      --radius-pill:999px;
      --cyan:#22d3ee;
      --good:#22c55e;
      --warn:#f59e0b;
      --bad:#fb7185;
      --font:"Bahnschrift","Segoe UI Variable Display","Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,-apple-system,sans-serif;
      --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%}
    html{background:linear-gradient(180deg, var(--bg0), var(--bg1))}
    body{
      margin:0;
      font-family:var(--font);
      color:var(--text);
      background:
        radial-gradient(1200px 850px at 18% 10%, rgba(34,211,238,.18), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1)),
        url("/ui/bg_long.svg?v=ui-2026.02.28-02");
      background-repeat:no-repeat,no-repeat,no-repeat;
      background-position:18% 10%, top, center;
      background-size:auto,auto,cover;
      background-attachment:scroll,scroll,fixed;
      padding:18px 14px 28px;
      overflow-x:hidden;
    }
    @media (max-width:980px){body{background-attachment:scroll,scroll,scroll}}
    a{color:inherit}
    .wrap{max-width:1180px;margin:0 auto}
    .top{
      display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
      padding:14px 14px;
      border:1px solid var(--stroke);
      border-radius:var(--radius-panel);
      background:var(--surface);
      box-shadow:var(--shadow1);
      backdrop-filter:blur(8px);
      margin-bottom:12px;
    }
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .mini{font-size:12px;color:var(--muted2);font-weight:900}
    #who{font-family:var(--mono);font-size:11px;white-space:nowrap;text-align:right}
    .whoRow{margin-left:auto;justify-content:flex-end}
    .topRight{margin-left:auto}
    .btn{
      appearance:none;
      min-height:48px;
      padding:12px 12px;
      border-radius:var(--radius-btn);
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.04);
      color:var(--text);
      font-weight:900;
      cursor:pointer;
      transition:background .18s ease,border-color .18s ease,transform .06s ease;
      text-decoration:none;
      display:inline-grid;
      place-items:center;
    }
    .btn:hover{background:rgba(255,255,255,.08);border-color:var(--stroke2)}
    .btn:active{transform:translateY(1px)}
    .btn.primary{border-color:rgba(34,211,238,.30);background:rgba(34,211,238,.16)}
    .btn.danger{border-color:rgba(251,113,133,.28);background:rgba(251,113,133,.14)}
    .btn.good{border-color:rgba(34,197,94,.30);background:rgba(34,197,94,.14)}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .btn.small{
      min-height:38px;
      padding:8px 10px;
      border-radius:var(--radius-pill);
      font-size:12px;
    }
    .btn.small.nowrap{
      white-space:nowrap;
      font-size:11px;
      min-height:34px;
      padding:6px 9px;
    }
    #pkEnableBtn,#pkDisableBtn{
      border-radius:10px;
      min-height:36px;
      padding:7px 10px;
      font-size:12px;
    }
    .btn.iconOnly{padding:12px 12px;min-width:56px;min-height:48px}
    .btn.iconOnly svg{width:22px;height:22px;display:block;fill:currentColor}

    input,select{
      border:1px solid var(--stroke);
      border-radius:var(--radius-btn);
      padding:10px 12px;
      font-weight:950;
      min-height:44px;
      background:rgba(2,6,23,.22);
      color:var(--text);
      font-family:var(--font);
      transition:border-color .18s ease, background .18s ease;
    }
    input:hover,select:hover{border-color:var(--stroke2)}
    input[type="number"]{width:140px;text-align:right}
    input[type="password"]{width:220px}
    input[type="text"]{width:220px}
    .userCreateRow{display:flex;gap:10px;align-items:center;flex-wrap:nowrap}
    .userCreateRow input[type="text"]{width:180px}
    .userCreateRow input[type="password"]{width:190px}
    .userCreateRow select{min-width:96px}
    @media (max-width:1100px){
      .userCreateRow{flex-wrap:wrap}
      .userCreateRow input[type="text"], .userCreateRow input[type="password"]{width:220px}
    }

    .card{
      border:1px solid var(--stroke);
      border-radius:var(--radius-panel);
      background:var(--surface);
      box-shadow:var(--shadow1);
      backdrop-filter: blur(8px);
      padding:14px;
      overflow:hidden;
    }
    .sec{
      border:1px solid rgba(255,255,255,.06);
      border-radius:var(--radius-card);
      padding:12px;
      background:rgba(2,6,23,.22);
    }
    .grid{display:grid;grid-template-columns:1.45fr 1fr;gap:12px}
    @media (max-width:900px){.grid{grid-template-columns:1fr}}
    .userGrid{grid-template-columns:1.75fr .95fr}
    .sec-title{font-weight:950;letter-spacing:.2px;margin-bottom:10px}
    .hint{margin-top:10px;color:var(--muted2);font-size:12px;line-height:1.6}
    .hint.good{color:var(--good)}
    .hint.warn{color:var(--warn)}
    .hint.bad{color:var(--bad)}
    #statusDiag{white-space:pre-line}

    table{width:100%;border-collapse:separate;border-spacing:0}
    th,td{font-size:12px;text-align:left;padding:10px 10px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
    th{color:var(--muted2);font-weight:950}
    td{color:var(--text);font-family:var(--mono)}
    .userTable{table-layout:fixed}
    .userTable th,.userTable td{font-family:var(--mono);font-size:12px;vertical-align:middle}
    .userTable th:nth-child(1), .userTable td:nth-child(1){width:46px}
    .userTable th:nth-child(2), .userTable td:nth-child(2){width:120px}
    .userTable th:nth-child(3), .userTable td:nth-child(3){width:90px}
    .userTable th:nth-child(4), .userTable td:nth-child(4){width:90px}
    .tag{display:inline-block;padding:4px 8px;border-radius:999px;border:1px solid var(--stroke);background:rgba(255,255,255,.04);font-size:12px;font-weight:950;font-family:var(--mono)}
    .tag.good{border-color:rgba(34,197,94,.25);color:#b7f7cc;background:rgba(34,197,94,.08)}
    .tag.bad{border-color:rgba(251,113,133,.28);color:#ffc1ce;background:rgba(251,113,133,.08)}
    .tag.warn{border-color:rgba(245,158,11,.28);color:#ffd59a;background:rgba(245,158,11,.08)}
    :focus-visible{outline:3px solid rgba(56,189,248,.65);outline-offset:2px;border-radius:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="row">
        <a class="btn" href="/">返回面板</a>
        <a class="btn" href="/rules">规则</a>
        <a class="btn" href="/replay">回放</a>
      </div>
      <div class="row whoRow">
        <span class="mini" id="who">--</span>
      </div>
      <div class="row topRight">
        <a class="btn" href="https://mqtt.530555.xyz/" target="_blank" rel="noopener noreferrer">MQTT</a>
        <a class="btn iconOnly" href="https://github.com/louis16s/fish" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.66 7.66 0 0 1 8 4.71c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8Z"></path>
          </svg>
        </a>
        <button class="btn danger" onclick="logout()">退出</button>
      </div>
    </div>

    <div class="card">
      <div class="sec-title">水闸控制面板配置</div>
      <div class="grid">
        <div class="sec">
          <div class="sec-title">数据保留</div>
          <div class="row">
            <label class="mini">保留天数</label>
            <input id="retDays" type="number" min="1" max="3650" step="1" value="30">
            <button class="btn primary" id="btnSaveRet" onclick="saveRetention()">保存</button>
          </div>
          <div class="hint">历史数据将写入服务器数据库，并按该天数自动清理（防止磁盘增长无上限）。</div>
          <div class="hint bad" id="retMsg" style="display:none"></div>
        </div>

        <div class="sec">
          <div class="sec-title">服务器/设备信息</div>
          <div class="hint" id="statusLine">加载中…</div>
          <div class="hint" id="statusDiag">--</div>
          <div class="hint">说明：面板不会把 MQTT 密码暴露给浏览器，所有订阅/下发均在服务器完成。</div>
          <div style="height:10px"></div>
          <div class="sec-title">Passkey</div>
          <div class="row">
            <button class="btn small" id="pkEnableBtn" onclick="enablePasskey()">开启Passkey</button>
            <button class="btn small danger" id="pkDisableBtn" onclick="disablePasskey()">关闭Passkey</button>
          </div>
          <div class="hint" id="pkStatus">--</div>
        </div>
      </div>

      <div style="height:12px"></div>

      <div class="grid userGrid">
        <div class="sec">
          <div class="sec-title">用户管理（管理员）</div>
          <div class="row userCreateRow">
            <input id="newUser" type="text" placeholder="用户名">
            <input id="newPass" type="password" placeholder="密码（>=8）">
            <select id="newRole" aria-label="角色">
              <option value="user">user</option>
              <option value="admin">admin</option>
            </select>
            <button class="btn primary" onclick="createUser()">创建</button>
          </div>
          <div class="hint bad" id="userMsg" style="display:none"></div>
          <div style="margin-top:10px;overflow:auto">
            <table class="userTable">
              <thead>
                <tr>
                  <th>ID</th><th>用户名</th><th>角色</th><th>状态</th><th>操作</th>
                </tr>
              </thead>
              <tbody id="userBody"></tbody>
            </table>
          </div>
        </div>

        <div class="sec">
          <div class="sec-title">设备列表</div>
          <details id="devAddFold">
            <summary class="mini" style="cursor:pointer">添加设备选项（默认折叠，点击展开）</summary>
            <div style="height:10px"></div>
            <div class="row userCreateRow">
              <input id="newDeviceId" type="text" placeholder="MQTT设备ID（必填，如 fish2）">
              <input id="newDeviceName" type="text" placeholder="设备名称（可选）">
              <input id="newMqttUser" type="text" placeholder="MQTT用户名（可选）">
            </div>
            <div style="height:8px"></div>
            <details>
              <summary class="mini" style="cursor:pointer">MQTT 主题参数（高级，可留空自动生成）</summary>
              <div style="height:8px"></div>
              <div class="row userCreateRow">
                <input id="topicTelemetry" type="text" placeholder="遥测主题（默认 <id>/device/telemetry）">
                <input id="topicCommand" type="text" placeholder="命令主题（默认 <id>/device/command）">
              </div>
              <div style="height:8px"></div>
              <div class="row userCreateRow">
                <input id="topicReply" type="text" placeholder="回复主题（默认 <id>/device/reply）">
                <input id="topicLog" type="text" placeholder="日志主题（默认 <id>/device/log）">
              </div>
            </details>
            <div style="height:10px"></div>
            <button class="btn primary" onclick="createDevice()">添加设备</button>
          </details>
          <div class="hint bad" id="devMsg" style="display:none"></div>
          <div class="hint">MQTT 新设备参数至少需要 `device_id`；其余参数可留空并使用默认 topic 规则。</div>
          <div style="margin-top:10px;overflow:auto">
            <table>
              <thead>
                <tr>
                  <th>device_id</th><th>名称</th><th>MQTT用户</th><th>last_seen</th><th>操作</th>
                </tr>
              </thead>
              <tbody id="devBody"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const $ = (id)=>document.getElementById(id);
    const LS_REM = 'fish_login_remember_map_v1';
    const LS_PK = 'fish_login_passkey_map_v1';
    const LS_REM_LEGACY = 'fish_login_remember_v1';
    const LS_PK_LEGACY = 'fish_login_passkey_id_v1';
    let g_currentUser = '';
    let g_userById = {};

    async function logout(){
      try{ await fetch('/api/auth/logout', {method:'POST'}); }catch(e){}
      location.href = '/login';
    }

    function showMsg(el, text){
      if(!el) return;
      const t = (text || '').trim();
      if(!t){ el.style.display='none'; el.textContent=''; return; }
      el.style.display='';
      el.textContent=t;
    }
    function esc(v){
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    function loadMap(key){
      try{
        const raw = localStorage.getItem(key);
        if(!raw) return {};
        const v = JSON.parse(raw);
        return (v && typeof v === 'object') ? v : {};
      }catch(e){ return {}; }
    }
    function saveMap(key, map){
      try{ localStorage.setItem(key, JSON.stringify(map || {})); }catch(e){}
    }
    function migrateLegacyPasskeyAndRemember(username){
      const uname = String(username || '').trim();
      if(!uname) return;
      try{
        const oldRaw = localStorage.getItem(LS_REM_LEGACY);
        if(oldRaw){
          const old = JSON.parse(oldRaw);
          if(old && old.u && old.p){
            const map = loadMap(LS_REM);
            if(!map[old.u]) map[old.u] = { p: String(old.p), ts: old.ts || Date.now() };
            saveMap(LS_REM, map);
          }
          localStorage.removeItem(LS_REM_LEGACY);
        }
      }catch(e){}
      try{
        const oldPk = localStorage.getItem(LS_PK_LEGACY);
        if(oldPk){
          const map = loadMap(LS_PK);
          if(!map[uname]) map[uname] = String(oldPk);
          saveMap(LS_PK, map);
          localStorage.removeItem(LS_PK_LEGACY);
        }
      }catch(e){}
    }

    function b64uFromBuf(buf){
      const arr = new Uint8Array(buf);
      let s = '';
      for(let i=0;i<arr.length;i++) s += String.fromCharCode(arr[i]);
      return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }
    function randBuf(n){
      const u = new Uint8Array(n);
      crypto.getRandomValues(u);
      return u;
    }
    function updatePasskeyStatus(){
      const st = $('pkStatus');
      if(!st) return;
      const uname = g_currentUser;
      if(!uname){
        st.textContent = '状态：未登录';
        return;
      }
      const pkMap = loadMap(LS_PK);
      const remMap = loadMap(LS_REM);
      const hasPk = !!pkMap[uname];
      const hasRem = !!(remMap[uname] && remMap[uname].p);
      if(hasPk && hasRem) st.textContent = '状态：已开启（账号已绑定）';
      else if(hasPk) st.textContent = '状态：已开启（账号已绑定；未记住密码）';
      else st.textContent = '状态：未开启（当前账号）';
    }
    async function enablePasskey(){
      const st = $('pkStatus');
      if(!(window.PublicKeyCredential && window.isSecureContext)){
        if(st) st.textContent = '开启失败：当前环境不支持 Passkey（需 HTTPS）';
        return;
      }
      try{
        const uname = g_currentUser;
        if(!uname){
          if(st) st.textContent = '开启失败：未登录';
          return;
        }
        const cred = await navigator.credentials.create({
          publicKey: {
            challenge: randBuf(32),
            rp: { name: '鱼塘控制面板' },
            user: { id: randBuf(16), name: uname, displayName: uname },
            pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
            timeout: 60000,
            attestation: 'none',
            authenticatorSelection: { userVerification: 'preferred', residentKey: 'preferred' }
          }
        });
        if(!cred || !cred.rawId) throw new Error('create_failed');
        const map = loadMap(LS_PK);
        map[uname] = b64uFromBuf(cred.rawId);
        saveMap(LS_PK, map);
        if(st) st.textContent = '已开启 Passkey';
      }catch(e){
        if(st) st.textContent = '开启失败：已取消或浏览器不支持';
      }
      updatePasskeyStatus();
    }
    async function disablePasskey(){
      const st = $('pkStatus');
      try{
        const uname = g_currentUser;
        if(!uname){
          if(st) st.textContent = '关闭失败：未登录';
          return;
        }
        const map = loadMap(LS_PK);
        delete map[uname];
        saveMap(LS_PK, map);
        if(st) st.textContent = '已关闭 Passkey（当前账号）';
      }catch(e){
        if(st) st.textContent = '关闭失败';
      }
      updatePasskeyStatus();
    }
    window.enablePasskey = enablePasskey;
    window.disablePasskey = disablePasskey;

    async function apiJson(url, opts){
      const r = await fetch(url, Object.assign({cache:'no-store'}, opts||{}));
      const tx = await r.text();
      let j = null; try{ j = tx ? JSON.parse(tx) : null }catch(e){}
      if(!r.ok) throw new Error((j && j.error) ? j.error : ('HTTP ' + r.status));
      return j;
    }

    async function loadMe(){
      try{
        const j = await apiJson('/api/auth/me');
        const u = j && j.user ? j.user : null;
        g_currentUser = u && u.username ? String(u.username) : '';
        $('who').textContent = u ? ('用户 ' + u.username + ' | ' + u.role) : '--';
        migrateLegacyPasskeyAndRemember(g_currentUser);
        updatePasskeyStatus();
      }catch(e){
        location.href = '/login';
      }
    }

    async function loadStatus(){
      try{
        const j = await apiJson('/get');
        const serverMqtt = (j && j.mqtt && j.mqtt.server_connected) ? '服务器MQTT 已连接' : '服务器MQTT 未连接';
        const db = (j && j.db_connected) ? 'DB OK' : 'DB ERR';
        const devMqtt = (j && j.telemetry && j.telemetry.device_mqtt_online) ? '设备MQTT 在线' : '设备MQTT 离线';
        $('statusLine').textContent = serverMqtt + ' | ' + db + ' | ' + devMqtt;

        const deviceId = (j && j.device_id) ? j.device_id : '--';
        const rssi = (j && j.device && Number.isFinite(j.device.rssi_dbm)) ? String(j.device.rssi_dbm) : '--';
        const ip = (j && j.device && j.device.ip) ? j.device.ip : '--';
        const fw = (j && j.device && j.device.fw) ? j.device.fw : '--';
        const seen = (j && j.telemetry) ? fmtMsEpoch(j.telemetry.last_telemetry_at) : '--';
        $('statusDiag').textContent =
          '设备 ' + deviceId + ' | RSSI ' + rssi + ' dBm | IP ' + ip + '\n固件 ' + fw + ' | 最后上报 ' + seen;
      }catch(e){
        $('statusLine').textContent = '状态获取失败';
        if($('statusDiag')) $('statusDiag').textContent = '--';
      }
    }

    async function loadRetention(){
      try{
        const j = await apiJson('/api/admin/settings');
        if(j && typeof j.retention_days === 'number') $('retDays').value = '' + j.retention_days;
        showMsg($('retMsg'), '');
      }catch(e){
        showMsg($('retMsg'), '无权限或加载失败：' + e.message);
      }
    }

    async function saveRetention(){
      const v = parseInt($('retDays').value, 10);
      try{
        const j = await apiJson('/api/admin/settings', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({retention_days: v})
        });
        showMsg($('retMsg'), j && j.ok ? '已保存' : '保存失败');
        $('retMsg').className = (j && j.ok) ? 'hint good' : 'hint bad';
      }catch(e){
        $('retMsg').className = 'hint bad';
        showMsg($('retMsg'), '保存失败：' + e.message);
      }
    }
    window.saveRetention = saveRetention;

    function roleTag(role){
      const r = (role || 'user').toLowerCase();
      if(r === 'admin') return '<span class="tag warn">admin</span>';
      return '<span class="tag">user</span>';
    }
    function statusTag(disabled){
      return disabled ? '<span class="tag bad">disabled</span>' : '<span class="tag good">active</span>';
    }

    async function loadUsers(){
      const body = $('userBody');
      if(body) body.innerHTML = '<tr><td colspan="5">加载中…</td></tr>';
      try{
        const j = await apiJson('/api/admin/users');
        const list = (j && Array.isArray(j.users)) ? j.users : [];
        g_userById = {};
        list.forEach((u) => { g_userById[String(u.id)] = u; });
        if(!body) return;
        if(!list.length){
          body.innerHTML = '<tr><td colspan="5">(空)</td></tr>';
          return;
        }
        body.innerHTML = list.map(u=>{
          const dis = !!u.disabled;
          const btnDis = dis ? '启用' : '禁用';
          const isAdmin = String(u.role || '').toLowerCase() === 'admin' || String(u.username || '').toLowerCase() === 'admin';
          const disableBtn = isAdmin
            ? '<button class="btn small danger" disabled>不可禁用</button>'
            : '<button class="btn small danger" onclick="toggleDis(' + u.id + ',' + (dis? 'false':'true') + ')">' + btnDis + '</button>';
          const delBtn = isAdmin
            ? '<button class="btn small nowrap danger" disabled>不可删除</button>'
            : '<button class="btn small danger" onclick="deleteUser(' + u.id + ')">删除</button>';
          const pwBtn = isAdmin
            ? '<button class="btn small" onclick="changePw(' + u.id + ',true)">修改密码</button>'
            : '<button class="btn small" onclick="changePw(' + u.id + ',false)">重置密码</button>';
          return '<tr>' +
            '<td>' + esc(u.id) + '</td>' +
            '<td>' + esc(u.username||'') + '</td>' +
            '<td>' + roleTag(u.role) + '</td>' +
            '<td>' + statusTag(dis) + '</td>' +
            '<td style="font-family:var(--font)">' +
              pwBtn + ' ' +
              disableBtn + ' ' +
              delBtn +
            '</td>' +
          '</tr>';
        }).join('');
        showMsg($('userMsg'), '');
      }catch(e){
        if(body) body.innerHTML = '<tr><td colspan="5">无权限或加载失败</td></tr>';
        showMsg($('userMsg'), '提示：只有 admin 才能管理用户。');
      }
    }

    async function createUser(){
      const u = ($('newUser').value || '').trim();
      const p = $('newPass').value || '';
      const role = $('newRole').value || 'user';
      try{
        const j = await apiJson('/api/admin/users', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({username:u, password:p, role})
        });
        showMsg($('userMsg'), j && j.ok ? '已创建' : '创建失败');
        $('newPass').value = '';
        await loadUsers();
      }catch(e){
        showMsg($('userMsg'), '创建失败：' + e.message);
      }
    }
    window.createUser = createUser;

    async function toggleDis(id, disabled){
      const u = g_userById[String(id)] || null;
      if(!u){
        showMsg($('userMsg'), '操作失败：用户不存在');
        return;
      }
      if(String(u.role || '').toLowerCase() === 'admin' || String(u.username || '').toLowerCase() === 'admin'){
        showMsg($('userMsg'), 'admin 账号不可禁用');
        return;
      }
      const uname = String(u.username || ('#' + id));
      const actionText = disabled ? '禁用' : '启用';
      if(!confirm('确认' + actionText + '账号 "' + uname + '" 吗？')) return;
      if(!confirm('二次确认：' + actionText + '后将立即生效，确认继续？')) return;
      try{
        await apiJson('/api/admin/users/' + id + '/disable', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({disabled: !!disabled})
        });
        showMsg($('userMsg'), '已' + actionText + '：' + uname);
        await loadUsers();
      }catch(e){
        showMsg($('userMsg'), '操作失败：' + e.message);
      }
    }
    window.toggleDis = toggleDis;

    async function changePw(id, isAdmin){
      const u = g_userById[String(id)] || null;
      const uname = u && u.username ? String(u.username) : ('#' + id);
      const p = prompt('输入新密码（>=8）');
      if(!p) return;
      if(!confirm('确认要' + (isAdmin ? '修改' : '重置') + '账号 "' + uname + '" 的密码吗？')) return;
      if(!confirm('二次确认：将立即生效，确认继续？')) return;
      try{
        await apiJson('/api/admin/users/' + id + '/password', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({password: p})
        });
        showMsg($('userMsg'), (isAdmin ? '已修改密码' : '已重置密码'));
      }catch(e){
        showMsg($('userMsg'), (isAdmin ? '修改失败：' : '重置失败：') + e.message);
      }
    }
    window.changePw = changePw;

    async function deleteUser(id){
      const u = g_userById[String(id)] || null;
      if(!u){
        showMsg($('userMsg'), '删除失败：用户不存在');
        return;
      }
      if(String(u.role || '').toLowerCase() === 'admin' || String(u.username || '').toLowerCase() === 'admin'){
        showMsg($('userMsg'), 'admin 账号不可删除');
        return;
      }
      const uname = String(u.username || '');
      if(!confirm('确认删除账号 "' + uname + '"？此操作不可恢复。')) return;
      try{
        await apiJson('/api/admin/users/' + id + '/delete', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({})
        });
        showMsg($('userMsg'), '已删除：' + uname);
        await loadUsers();
      }catch(e){
        showMsg($('userMsg'), '删除失败：' + e.message);
      }
    }
    window.deleteUser = deleteUser;

    function fmtTs(v){
      if(!v) return '--';
      try{
        const d = new Date(v);
        return d.toLocaleString();
      }catch(e){ return String(v); }
    }

    function fmtMsEpoch(ms){
      const n = Number(ms || 0);
      if(!Number.isFinite(n) || n <= 0) return '--';
      try{
        return new Date(n).toLocaleString();
      }catch(e){ return '--'; }
    }

    async function loadDevices(){
      const body = $('devBody');
      if(body) body.innerHTML = '<tr><td colspan="5">加载中…</td></tr>';
      try{
        const j = await apiJson('/api/devices');
        const list = (j && Array.isArray(j.devices)) ? j.devices : [];
        if(!body) return;
        if(!list.length){
          body.innerHTML = '<tr><td colspan="5">(空)</td></tr>';
          return;
        }
        body.innerHTML = list.map(d=>{
          const did = String(d.device_id || '');
          const noDelete = did.toLowerCase() === 'fish1';
          const delBtn = noDelete
            ? '<button class="btn small nowrap danger" disabled>不可删除</button>'
            : '<button class="btn small danger" data-device-id="' + esc(did) + '" onclick="deleteDeviceFromBtn(this)">删除</button>';
          return '<tr><td>' + esc(did) + '</td><td>' + esc(d.display_name||'') + '</td><td>' + esc(d.mqtt_username||'') + '</td><td>' + esc(fmtTs(d.last_seen_at)) + '</td><td style="font-family:var(--font)">' + delBtn + '</td></tr>';
        }).join('');
        showMsg($('devMsg'), '');
      }catch(e){
        if(body) body.innerHTML = '<tr><td colspan="5">加载失败</td></tr>';
      }
    }

    function deviceDefaultTopics(deviceId){
      const did = String(deviceId || '').trim();
      return {
        telemetry: did ? (did + '/device/telemetry') : '',
        command: did ? (did + '/device/command') : '',
        reply: did ? (did + '/device/reply') : '',
        log: did ? (did + '/device/log') : ''
      };
    }

    async function createDevice(){
      const deviceId = ($('newDeviceId').value || '').trim();
      const displayName = ($('newDeviceName').value || '').trim();
      const mqttUsername = ($('newMqttUser').value || '').trim();
      const topicTelemetry = ($('topicTelemetry').value || '').trim();
      const topicCommand = ($('topicCommand').value || '').trim();
      const topicReply = ($('topicReply').value || '').trim();
      const topicLog = ($('topicLog').value || '').trim();
      if(!deviceId){
        showMsg($('devMsg'), 'device_id 不能为空');
        return;
      }
      try{
        const j = await apiJson('/api/admin/devices', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            device_id: deviceId,
            display_name: displayName,
            mqtt_username: mqttUsername,
            mqtt_telemetry_topic: topicTelemetry,
            mqtt_command_topic: topicCommand,
            mqtt_reply_topic: topicReply,
            mqtt_log_topic: topicLog
          })
        });
        if(j && j.ok){
          $('newDeviceId').value = '';
          $('newDeviceName').value = '';
          $('newMqttUser').value = '';
          $('topicTelemetry').value = '';
          $('topicCommand').value = '';
          $('topicReply').value = '';
          $('topicLog').value = '';
          showMsg($('devMsg'), '设备已添加');
          $('devMsg').className = 'hint good';
          await loadDevices();
        }else{
          $('devMsg').className = 'hint bad';
          showMsg($('devMsg'), '添加失败');
        }
      }catch(e){
        $('devMsg').className = 'hint bad';
        showMsg($('devMsg'), '添加失败：' + e.message);
      }
    }
    window.createDevice = createDevice;

    async function deleteDevice(deviceId){
      const did = String(deviceId || '').trim();
      if(!did) return;
      if(did.toLowerCase() === 'fish1'){
        $('devMsg').className = 'hint bad';
        showMsg($('devMsg'), 'fish1 不可删除');
        return;
      }
      if(!confirm('确认删除设备 "' + did + '" 吗？')) return;
      if(!confirm('二次确认：删除后将从设备列表移除，确认继续？')) return;
      try{
        await apiJson('/api/admin/devices/' + encodeURIComponent(did) + '/delete', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({})
        });
        $('devMsg').className = 'hint good';
        showMsg($('devMsg'), '已删除设备：' + did);
        await loadDevices();
      }catch(e){
        $('devMsg').className = 'hint bad';
        showMsg($('devMsg'), '删除失败：' + e.message);
      }
    }
    function deleteDeviceFromBtn(btn){
      const did = btn && btn.getAttribute ? btn.getAttribute('data-device-id') : '';
      return deleteDevice(did || '');
    }
    window.deleteDevice = deleteDevice;
    window.deleteDeviceFromBtn = deleteDeviceFromBtn;

    (function init(){
      loadMe();
      loadStatus();
      loadRetention();
      loadUsers();
      loadDevices();
      const idInput = $('newDeviceId');
      if(idInput){
        idInput.addEventListener('input', function(){
          const did = (idInput.value || '').trim();
          const def = deviceDefaultTopics(did);
          const t1 = $('topicTelemetry');
          const t2 = $('topicCommand');
          const t3 = $('topicReply');
          const t4 = $('topicLog');
          if(t1 && !t1.value) t1.value = def.telemetry;
          if(t2 && !t2.value) t2.value = def.command;
          if(t3 && !t3.value) t3.value = def.reply;
          if(t4 && !t4.value) t4.value = def.log;
        });
      }
      setInterval(loadStatus, 5000);
      setInterval(loadDevices, 15000);
    })();
  </script>
</body>
</html>
